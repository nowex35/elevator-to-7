<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:#e8e8e4; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; }
  .stage { position:relative; width:min(100vw, calc(100dvh * 941 / 1672)); aspect-ratio:941/1672; margin:0 auto; overflow:hidden; background:#000; container-type:inline-size; user-select:none; }
  .stage > * { position:absolute; }
  .L { inset:0; width:100%; height:100%; object-fit:cover; }

  /* 廊下(開口部の向こう側)。枠で隠れるよう開口部で切り取る */
  .corr { inset:0; clip-path:inset(13.3% 10.6% 19.5% 9.8%); }
  .corr > * { position:absolute; }
  .person img { display:block; height:100%; width:auto; filter:brightness(.58) contrast(1.06) saturate(.7); }
  .person .shade { position:absolute; inset:0; background:linear-gradient(#f2fbf4 0%, transparent 30%, rgba(0,0,0,.6) 100%); mix-blend-mode:soft-light; -webkit-mask-size:100% 100%; mask-size:100% 100%; }
  .person.boarding { transition:opacity .7s ease .2s; opacity:0 !important; }
  .person.alt { opacity:0; } .corr.bowing .person:not(.alt) { opacity:0; } .corr.bowing .person.alt { opacity:1; }
  .shadow { border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,.35) 60%, transparent); filter:blur(3px); }
  .label { position:absolute; background:#e9e6dc; color:#222; font:600 2.1cqw/1.2 system-ui; padding:.4cqw .8cqw; transform:rotate(-2deg); white-space:nowrap; filter:brightness(.62); }

  /* 扉:開口部でクリップ。映り込みと天井の光は .rfix で扉の移動を打ち消して画面に固定 */
  .doors { left:9.8%; top:13.3%; width:79.6%; height:67.2%; overflow:hidden; }
  .door { position:absolute; top:0; height:100%; width:50%; overflow:hidden; transition:transform .9s cubic-bezier(.6,.05,.3,1); }
  .door > img { width:100%; height:100%; object-fit:cover; display:block; }
  .door.l { left:0; } .door.r { left:50%; }
  .stage.open .door.l { transform:translateX(-101%); } .stage.open .door.r { transform:translateX(101%); }
  .rfix { position:absolute; inset:0; transition:transform .9s cubic-bezier(.6,.05,.3,1); }
  .rfix.light { mix-blend-mode:hard-light; } .rfix.mirror { mix-blend-mode:screen; }
  .stage.open .door.l .rfix { transform:translateX(101%); } .stage.open .door.r .rfix { transform:translateX(-101%); }
  .refl { position:absolute; pointer-events:none; filter:blur(2.2px) grayscale(.4) brightness(1.2); transform:scaleX(-1); transform-origin:50% 100%; }
  .refl img { height:100%; width:auto; display:block; }

  /* 照明(廊下側。開口部で切り取る) */
  .fx > div { position:absolute; inset:0; pointer-events:none; }
  .fx .flicker { background:#000; opacity:0; animation:flick 3.7s infinite; }
  @keyframes flick { 0%,41%,44%,47%,100% { opacity:0; } 42% { opacity:.45; } 45% { opacity:.3; } 46% { opacity:.55; } 72% { opacity:0; } 73% { opacity:.4; } 74% { opacity:0; } }
  /* 置き物・異変・奥の暗がりは、すべて同じ位置に重ねる(人物より後ろ) */
  #bgAnom > * { position:absolute; inset:0; width:100%; height:100%; }
  /* 奥が暗い照明。fardark は人物の後ろに置き、奥に立つ人だけ .infar で暗くする。shadowed は人物の手前に置き、顔にもかかる(どちらも異変ではない) */
  .fardark { pointer-events:none; background:radial-gradient(ellipse 26% 20% at 50% 37%, rgba(0,0,0,.92) 35%, transparent 100%); }
  .person.infar { filter:brightness(.3); }
  .fx .out { opacity:0; transition:opacity .25s; }
  .fx .out.o1 { background:radial-gradient(ellipse 22% 17% at 50% 37%, rgba(0,0,0,.95) 45%, transparent 100%); }
  .fx .out.o2 { background:radial-gradient(ellipse 48% 36% at 50% 37%, rgba(0,0,0,.95) 45%, transparent 100%); }
  .fx .out.o3 { background:radial-gradient(ellipse 90% 70% at 50% 40%, rgba(0,0,0,.93) 45%, transparent 100%); }
  .fx.going .out.o1 { opacity:1; transition-delay:1.4s; } .fx.going .out.o2 { opacity:1; transition-delay:2.6s; } .fx.going .out.o3 { opacity:1; transition-delay:3.8s; }
  .poster .note { font-size:2.4cqw; color:#555; margin-top:.8cqw; line-height:1.4; }
  .grain { inset:0; pointer-events:none; opacity:.09; mix-blend-mode:overlay; }
  .vig { inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,.6) 100%); }
  .dim { inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .15s; }
  /* ドボンの一撃:画面いっぱいの顔が迫る。明滅は「出る→黒」の1回だけ(点滅で気分が悪くなる人がいるため) */
  .scare { z-index:7; inset:0; opacity:0; pointer-events:none; overflow:hidden; background:#000; }
  .scare.on { opacity:1; }
  .scare img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%; filter:grayscale(1) contrast(1.6) brightness(.72) blur(.4px); transform-origin:50% 38%; }
  .scare img.ghost { opacity:.35; mix-blend-mode:screen; filter:grayscale(1) contrast(1.4) brightness(.7) blur(2px); }
  .scare::after { content:""; position:absolute; inset:0; background:radial-gradient(ellipse 55% 42% at 50% 36%, transparent 30%, rgba(0,0,0,.92) 100%); }
  .scare.on img { animation:lunge .38s cubic-bezier(.2,.8,.3,1) both; }
  .scare.on img.ghost { animation:lungeGhost .38s cubic-bezier(.2,.8,.3,1) both; }
  @keyframes lunge { 0% { transform:scale(1.5); } 25% { transform:scale(1.6) translate(-1.5%,1%); } 50% { transform:scale(1.7) translate(1.2%,-.8%); } 75% { transform:scale(1.78) translate(-.8%,-1%); } 100% { transform:scale(1.85); } }
  /* 生成した縦長の顔は、すでに寄りの構図なので拡大を控えめにする */
  .scare.full img { filter:grayscale(.85) contrast(1.35) brightness(.95) blur(.3px); }
  .scare.full img.ghost { filter:grayscale(1) contrast(1.2) brightness(.9) blur(2px); }
  .scare.full.on img { animation-name:lungeFull; }
  .scare.full.on img.ghost { animation-name:lungeFullGhost; }
  @keyframes lungeFull { 0% { transform:scale(1.04); } 25% { transform:scale(1.1) translate(-1.5%,1%); } 50% { transform:scale(1.16) translate(1.2%,-.8%); } 75% { transform:scale(1.22) translate(-.8%,-1%); } 100% { transform:scale(1.28); } }
  @keyframes lungeFullGhost { 0% { transform:scale(1.1) translate(3%,0); } 50% { transform:scale(1.22) translate(-3%,1%); } 100% { transform:scale(1.36) translate(2%,-1%); } }
  @keyframes lungeGhost { 0% { transform:scale(1.58) translate(3%,0); } 50% { transform:scale(1.78) translate(-3%,1%); } 100% { transform:scale(1.95) translate(2%,-1%); } }

  /* HUD */
  .hud { left:0; right:0; top:0; height:12%; display:flex; align-items:center; justify-content:center; }
  .ind { font:700 6cqw/1 ui-monospace,Menlo,monospace; color:#ff6a3d; background:#120806; padding:1.2cqw 3cqw; border-radius:1cqw; letter-spacing:.5cqw; text-shadow:0 0 2cqw rgba(255,90,40,.7); min-width:22cqw; text-align:center; }
  .ind .arr { font-size:3.6cqw; vertical-align:.6cqw; margin-right:1.5cqw; }
  .ind.moving .arr { animation:blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .paper { left:4%; top:3%; width:10cqw; height:13cqw; background:#e2ded2; border-radius:.6cqw; box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.6); filter:brightness(.55); cursor:pointer; padding:1.5cqw 1.2cqw; }
  .paper i { display:block; height:.6cqw; background:#8b877d; margin:0 0 1.1cqw; border-radius:1px; }
  /* 言語:地球のマークを押すと、一覧から選ぶ */
  .lang { z-index:6; right:4%; top:4%; }
  .langbtn { display:flex; align-items:center; justify-content:center; width:8.6cqw; height:8.6cqw; padding:0; border-radius:50%; background:rgba(0,0,0,.5); border:1px solid #444; cursor:pointer; }
  .langbtn svg { width:5.2cqw; height:5.2cqw; fill:none; stroke:#aaa; stroke-width:1.6; }
  .langbtn[aria-expanded="true"] { border-color:#ff7a4a; }
  .langmenu { position:absolute; right:0; top:calc(100% + 1.5cqw); min-width:32cqw; padding:1cqw; background:#16181a; border:1px solid #3b4044; border-radius:1.5cqw; box-shadow:0 1.5cqw 4cqw rgba(0,0,0,.8); }
  .langmenu[hidden] { display:none; }
  .langmenu button { display:flex; align-items:center; gap:1.6cqw; width:100%; padding:2.2cqw 2.6cqw; background:none; border:0; border-radius:1cqw; color:#cfccc3; font:600 3.6cqw system-ui; text-align:left; cursor:pointer; white-space:nowrap; }
  .langmenu button::before { content:"✓"; width:3cqw; visibility:hidden; }
  .langmenu button[aria-checked="true"] { color:#ffb08a; }
  .langmenu button[aria-checked="true"]::before { visibility:visible; }
  .langmenu button:active { background:#25282b; }
  .bottom { left:0; right:0; bottom:0; height:19.5%; display:flex; align-items:center; justify-content:center; gap:7%; }
  .panel { display:grid; grid-template-columns:repeat(2, 6.6cqw); gap:1.4cqw; padding:2cqw; background:#1b1e20; border-radius:1.5cqw; border:.4cqw solid #3b4044; }
  .panel b { width:6.6cqw; height:6.6cqw; border-radius:50%; border:.4cqw solid #5d6368; display:flex; align-items:center; justify-content:center; font:700 2.8cqw ui-monospace,Menlo,monospace; color:#8a8f93; background:#2a2e31; }
  .panel b.on { color:#ffb08a; border-color:#ff7a4a; box-shadow:0 0 2cqw rgba(255,110,60,.6), inset 0 0 1.5cqw rgba(255,110,60,.4); }
  .ctl { display:flex; gap:4cqw; }
  .ctl button { width:19cqw; height:19cqw; border-radius:50%; border:.6cqw solid #8b9196; background:radial-gradient(#3d4246,#222629); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; box-shadow:inset 0 -.8cqw 1.5cqw rgba(0,0,0,.5); }
  .ctl button svg { width:11cqw; height:7cqw; }
  .ctl button svg * { fill:#d9dcd8; stroke:#d9dcd8; }
  .ctl button:active { transform:scale(.95); }
  .ctl button.on { border-color:#ff7a4a; box-shadow:0 0 2.5cqw rgba(255,110,60,.55), inset 0 0 1.5cqw rgba(255,110,60,.35); }
  .ctl button.on svg * { fill:#ffb08a; stroke:#ffb08a; }
  .ctl button[disabled] { opacity:.4; pointer-events:none; }
  .caption { left:8%; right:8%; top:74%; text-align:center; font:500 3.4cqw/1.4 system-ui; color:#ddd; text-shadow:0 0 1cqw #000, 0 0 2cqw #000; opacity:0; transition:opacity .4s; pointer-events:none; }
  .caption.on { opacity:1; }

  /* オーバーレイ(貼り紙/結果) */
  .ov { z-index:5; inset:0; background:rgba(0,0,0,.82); display:flex; flex-direction:column; align-items:center; justify-content:safe center; padding:5cqw 5cqw; gap:3cqw; overflow:auto; }
  .ov.hide { display:none; }
  /* 共有メニューが使えないときに出す、保存用の画像 */
  .imgview { z-index:7; background:rgba(0,0,0,.92); }
  .imgview img { max-width:100%; max-height:72%; border-radius:1cqw; box-shadow:0 1cqw 4cqw rgba(0,0,0,.8); -webkit-touch-callout:default; user-select:auto; }
  .imgview .hint { font-size:3cqw; color:#bbb; }
  .poster { flex:none; background:#ebe7da; color:#1d1d1b; width:100%; padding:4.5cqw 5cqw 3.5cqw; border-radius:.8cqw; box-shadow:0 2cqw 6cqw rgba(0,0,0,.7); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .poster h2 { margin:0 0 .6cqw; font-size:4.4cqw; text-align:center; letter-spacing:.1cqw; white-space:nowrap; }
  .poster .sub { text-align:center; font-size:2.6cqw; margin:0 0 2.6cqw; color:#555; }
  .poster ol { margin:0; padding-left:5cqw; font-size:3.05cqw; line-height:1.5; }
  .poster li { margin:0 0 1.1cqw; }
  .poster li::marker { font-weight:700; }
  .poster .sign { text-align:right; font-size:2.6cqw; margin-top:1.2cqw; color:#555; }
  .intro { flex:none; font-size:3.1cqw; line-height:1.55; text-align:center; color:#ccc; }
  .intro b { color:#fff; }
  .go { flex:none; width:16cqw; height:16cqw; border-radius:50%; border:.7cqw solid #ff7a4a; background:#2a2e31; color:#ffb08a; font:700 7cqw ui-monospace,Menlo,monospace; box-shadow:0 0 4cqw rgba(255,110,60,.5); cursor:pointer; }
  .go small { display:block; font:500 2.2cqw system-ui; color:#aaa; margin-top:-.6cqw; }
  .row { display:flex; gap:2.5cqw; flex-wrap:wrap; justify-content:center; }
  /* 結果画面のボタン:記録紙と同じ幅の2列。2つ並ぶボタンは半分ずつ、もう一度プレイは2列ぶん */
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:2.5cqw; width:100%; flex:none; }
  /* 見た目はエレベーターの操作盤:暗い金属の板に明朝の文字。「もう一度プレイ」だけ、7のボタンと同じ橙色でゆっくり灯る(点滅はさせない) */
  .actions .btn { display:flex; align-items:center; justify-content:center; gap:1.6cqw; width:100%; padding:3.4cqw 2cqw; border-radius:1.2cqw;
    border:.4cqw solid #3b4044; background:linear-gradient(#2a2d30, #141618); color:#cfccc3;
    font:600 4.3cqw "Hiragino Mincho ProN","Yu Mincho",serif; letter-spacing:.35cqw;
    box-shadow:inset 0 .3cqw 0 rgba(255,255,255,.07), inset 0 -1cqw 2cqw rgba(0,0,0,.6), 0 .8cqw 2cqw rgba(0,0,0,.7); }
  .actions .btn:active { transform:translateY(.3cqw); box-shadow:inset 0 .8cqw 2cqw rgba(0,0,0,.8); }
  /* X は X のブランドガイドラインどおり、黒地に白いロゴ */
  .actions .btn.x { background:#000; color:#fff; }
  .actions .btn.x svg { height:4cqw; }
  .actions .btn.primary { border-color:#ff7a4a; background:#1d1f21; color:#ffb08a; animation:glow 3.6s ease-in-out infinite; }
  @keyframes glow { 0%, 100% { box-shadow:0 0 3cqw rgba(255,110,60,.45), inset 0 0 2cqw rgba(255,110,60,.3); } 50% { box-shadow:0 0 1.2cqw rgba(255,110,60,.2), inset 0 0 .8cqw rgba(255,110,60,.12); } }
  .actions .wide { grid-column:1 / -1; }
  /* LINE は公式のボタン画像をそのまま使う(色・形は変えない)。枠を画像と同じ緑(#06C755)で塗って、ほかのボタンと同じ大きさにし、画像は中央に置く */
  .actions .lineImg { display:flex; align-items:center; justify-content:center; background:#06c755; border-radius:1.2cqw; overflow:hidden;
    box-shadow:0 .8cqw 2cqw rgba(0,0,0,.7); }
  .actions .lineImg:active { transform:translateY(.3cqw); }
  .actions .lineImg img { display:block; max-width:92%; max-height:100%; width:auto; height:auto; }
  .btn { font:600 3.4cqw system-ui; padding:2.4cqw 4.4cqw; border-radius:6cqw; border:1px solid #555; background:#1b1e20; color:#eee; cursor:pointer; text-decoration:none; }
  .btn.primary { background:#eee; color:#111; border-color:#eee; }
  /* X の公式ボタン:X のブランドガイドライン(基本色は黒と白。暗い背景では白いロゴ)に沿う */
  .btn.x { display:inline-flex; align-items:center; gap:1.6cqw; background:#000; color:#fff; border-color:#6e6e6e; }
  .btn.x svg { height:3.3cqw; width:auto; fill:#fff; }
  .log { background:#e4e0d3; color:#1d1d1b; width:100%; padding:5cqw 6cqw; border-radius:.5cqw; box-shadow:0 2cqw 6cqw rgba(0,0,0,.7); font:3.5cqw/1.7 ui-monospace,"Osaka-Mono",Menlo,monospace; filter:brightness(.88); }
  .log h3 { margin:0 0 .5cqw; font:700 4.4cqw "Hiragino Mincho ProN","Yu Mincho",serif; text-align:center; letter-spacing:.4cqw; }
  .log .no { text-align:center; font-size:2.8cqw; color:#555; margin:0 0 3cqw; }
  .log .ln { display:flex; gap:3cqw; white-space:nowrap; }
  .log .ln span:last-child { white-space:normal; }
  .log .cut { margin-top:2cqw; color:#6b2a20; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .why { margin-top:2cqw; font-size:3cqw; line-height:1.6; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .why b { display:block; font-size:2.8cqw; color:#555; font-family:system-ui,sans-serif; font-weight:600; }
  .log .rep { margin-top:3cqw; padding-top:2cqw; border-top:1px dashed #999; }
  .log .rep h4 { margin:0 0 1cqw; font:700 3.4cqw "Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .rep .it { display:flex; justify-content:space-between; gap:2cqw; font-size:3cqw; }
  .log .rep .it .st { color:#8a6a1e; margin-right:1.5cqw; }
  .log .rep .tot { display:flex; justify-content:space-between; font-weight:700; margin-top:1cqw; font-size:3.6cqw; }
  .log .rep .tot.lost span:last-child { text-decoration:line-through; color:#888; }
  .log .rep .void { margin-top:1cqw; font-size:2.8cqw; color:#6b2a20; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .tally { margin-top:3cqw; padding-top:2cqw; border-top:1px dashed #999; font-size:2.9cqw; line-height:1.6; }
  .log .tally h4 { margin:0 0 1cqw; font:700 3.4cqw "Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .rules { margin-top:3cqw; padding-top:2cqw; border-top:1px dashed #999; font-size:2.8cqw; color:#555; }
</style>

<body>
<div class="stage" id="stage">
  <img class="L" id="plate" alt="">
  <div class="L" id="bgAnom"></div>
  <div class="corr" id="corr"></div>
  <div class="corr fx" id="fx"></div>
  <div class="doors">
    <div class="door l"><img src="parts/door-l.webp" alt=""><div class="rfix light" id="litL"></div><div class="rfix mirror" id="mirL"></div></div>
    <div class="door r"><img src="parts/door-r.webp" alt=""><div class="rfix light" id="litR"></div><div class="rfix mirror" id="mirR"></div></div>
  </div>
  <canvas class="grain" id="grain"></canvas>
  <div class="vig"></div>
  <div class="hud"><div class="ind" id="ind"><span class="arr">▲</span><span id="fl">1</span></div></div>
  <div class="paper" id="paper" title="貼り紙"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="lang" id="langBox">
    <button class="langbtn" id="lang" aria-haspopup="menu" aria-expanded="false" aria-label="言語 / Language"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/></svg></button>
    <div class="langmenu" id="langMenu" role="menu" hidden>
      <button role="menuitemradio" data-lang="ja">日本語</button>
      <button role="menuitemradio" data-lang="en">English</button>
    </div>
  </div>
  <div class="caption" id="cap"></div>
  <div class="bottom">

  $("closeBtn").disabled = true;
  riders = riders.filter(r => r.dest !== f); // 扉を開けた階でだけ、降りる人は降りる
  if (e.anomaly === "INDICATOR_13") $("fl").textContent = "13";
  const litBefore = new Set(lit);
  if (e.anomaly === "ALL_BUTTONS") { [1, 2, 3, 4, 5, 6, 7].forEach(n => lit.add(n)); setTimeout(paintPanel, 700); }

  openedAt = performance.now();
  $("closeBtn").disabled = false;

  if (e.bow) { timers.push(setTimeout(() => $("corr").classList.add("bowing"), 1200)); timers.push(setTimeout(() => $("corr").classList.remove("bowing"), 2600)); }
  if (e.board && e.press) timers.push(setTimeout(() => { lit.add(e.press); paintPanel(); sTick(); }, 2300));
  // 何もしなければ約6秒で閉まる。開いている間に「開」を押すと延長

  const isAnom = !!e.anomaly, correct = closed === isAnom, i = log.length;
  encounters.push({ floor: f, key: phKey(e), anomaly: isAnom, correct, name: phName(e) });
  if (correct) {
    let line = closed ? x.closed : !e.p ? x.empty : e.board ? x.boarded(name) : x.stood(name);
    if (!closed && e.board) { stage.querySelectorAll(".corr .person").forEach(x => x.classList.add("boarding")); riders.push({ p: e.p, dest: e.dest }); if (e.dest) { lit.add(e.dest); paintPanel(); } }
    setMirror(riders.map((r, k) => ({ p: r.p, pos: riderPos(k), o: .26 })));

    const k = phKey(e); if (k && PTS[k] && PTS[k][0] > 0) seen.push({ key: k, arg: e.follow || e.p || null, name: phName(e), pts: scoreItem(PTS[k][0], f, streak, closed, reactMs, e.env.lights, hesitMs), stars: PTS[k][1] });
    return true;
  }

    // 異変がないのに閉めた: ドボンにはしない。その階のスコアが入らないだけ(乗ろうとしていた住人は乗らない)
    setMirror(riders.map((r, k) => ({ p: r.p, pos: riderPos(k), o: .26 })));

  }

    const d = deathOf(e), others = [...riders, ...(d.refl === e.p ? [] : [{ p: e.p }])].map((r, k) => ({ p: r.p, pos: riderPos(k), o: .22 }));

    await closeDoors(); sSting(); hush(); await wait(900);

    await wait(700); // 間

// ============ ドボンの一撃:違和感に応じた顔が画面いっぱいに迫り、すぐ暗転する(約0.4秒) ============

const PERSON_ANOM = new Set(["OLDMAN", "OJISAN_NO_NOD", "MOURNER_OFF6", "CAPTION_707", "WRONG_FLOOR", "REBOARD", "MONK_7", "DELIV_LABEL", "OJISAN_BACK", "KID_NOBUTTON", "KID_BACK", "HOME_EARLY"]);

const FULL_FACE = { eye: [49, 40], shoes: [61, 32], floor13: [50, 40], dark: [52, 32], shadow: [52, 25], profile: [51, 28], kidwoman: [56, 36] };

const faceSrc = k => `face-${k}.webp`;
async function scare(face) {

  sc.className = "scare" + (fp ? " full" : "");
  sc.innerHTML = `<img src="${P + src}" alt=""${st}><img class="ghost" src="${P + src}" alt=""${st}>`; // ずれて重なる残像
  sc.classList.add("on"); sScare(); if (navigator.vibrate) navigator.vibrate(200);
  await wait(380);

const WAKE_LINE = () => personHTML("funeral", { cx: 560, feet: 990, h: 400 }) + personHTML("mourner", { cx: 620, feet: 1060, h: 500 }) + personHTML("monk", { cx: 700, feet: 1150, h: 640 });
// 自分の部屋(707)を指す異変。開けて見届けた夜だけ、7階で通夜の列が迎える
const SELF_REF = new Set(["DELIV_LABEL", "MONK_7", "HOME_EARLY"]);
async function arriveHome() {
  const called = encounters.some(e => SELF_REF.has(e.key) && e.correct);
  setMirror([]); $("plate").src = P + "corridor.webp"; $("bgAnom").innerHTML = ""; $("fx").innerHTML = "";
  $("corr").innerHTML = called ? WAKE_LINE() : ""; // 見届けていなければ、誰もいない自分の階
  sChime();
  $("openBtn").disabled = false; $("openBtn").classList.add("on");
  await new Promise(res => opener = res); opener = null; $("openBtn").classList.remove("on"); $("openBtn").disabled = true;
  await openDoors();

  await wait(called ? 4200 : 3000); caption(null);

}
function repHTML(home) {

    <div class="tot ${home ? "" : "lost"}"><span>${x.total}</span><span>${x.yen(bank())}</span></div>
    ${home ? "" : `<div class="void">${x.void}</div>`}</div>`;
}
// ドボンしたとき、何が起きていたかを1行で明かす(次の挑戦で活かせるように)
function whyHTML() {
  const e = lastDeath; if (!e) return "";
  const w = t().why[e.anomaly || "NORMAL"], n = e.p ? PEOPLE[e.p][lang] : "", h = e.p && HOME[e.p] ? HOME[e.p].f : "", pr = e.follow ? t().props[e.follow] : "";
  return `<div class="why"><b>${t().whyTitle}</b>${typeof w === "function" ? w(n, h, pr) : w}</div>`;
}
function logHTML(home) {

    ${log.map(([tm, f, l]) => `<div class="ln"><span>${tm}</span><span>${f}F</span><span>${l}</span></div>`).join("")}

// X のロゴ(about.x.com のブランドツールキットのページに載っているものと同じ形)
const X_LOGO = `<svg viewBox="0 0 1200 1227" aria-hidden="true"><path d="M714.163 519.284L1160.89 0H1055.03L667.137 450.887L357.328 0H0L468.492 681.821L0 1226.37H105.866L515.491 750.218L842.672 1226.37H1200L714.137 519.284H714.163ZM569.165 687.828L521.697 619.934L144.011 79.6944H306.615L611.412 515.685L658.88 583.579L1055.08 1150.3H892.476L569.165 687.854V687.828Z"/></svg>`;
// シェア文。出会った現象は載せない(これから遊ぶ人のネタバレになる)。記録番号も載せない(同じ夜は渡さない)
function shareText(home) {

}
function shareLinks(text) {

    <a class="lineImg" target="_blank" rel="noopener" href="https://social-plugins.line.me/lineit/share?url=${u}"><img src="${P}line-share-${lang}.png" alt="${x.line}"></a>

// サーバーに結果を送り、順位を結果画面に足す。通信できないときは何も出さない
async function submitRun(home) {
  const token = runToken, x = t();
  const body = { seed, lang, home, reached: floor, score: home ? bank() : 0,
    encounters: encounters.map(({ floor, key, anomaly, correct }) => ({ floor, key, anomaly, correct })) };

    if (!r.ok) return; res = await r.json();
  } catch { return; }
  if (token !== runToken || !res || !home || !res.rank) return; // もう次のプレイが始まっている/順位は帰り着いたときだけ

// ストーリーズなどに載せる縦長の画像(1080x1920)。サーバーを使わず、ブラウザで描く
const loadImg = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = P + src; });
function drawCover(c, im, x, y, w, h) {
  const s = Math.max(w / im.naturalWidth, h / im.naturalHeight), sw = w / s, sh = h / s;
  c.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
}
function fitText(c, text, weight, size, maxW) {

}
async function storyImage(home) {
  const x = t(), W = 1080, H = 1920, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const [plate, dl, dr] = await Promise.all(["corridor.webp", "door-l.webp", "door-r.webp"].map(loadImg));
  c.drawImage(plate, 0, 0, W, H);
  // 途切れたときは扉が閉じたところ(開口部は .doors と同じ位置)
  if (!home) { const dx = W * .098, dy = H * .133, dw = W * .796, dh = H * .672; drawCover(c, dl, dx, dy, dw / 2, dh); drawCover(c, dr, dx + dw / 2, dy, dw / 2, dh); }
  c.fillStyle = "rgba(0,0,0,.35)"; c.fillRect(0, 0, W, H);
  const g = c.createLinearGradient(0, H * .5, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.45, "rgba(0,0,0,.88)"); g.addColorStop(1, "rgba(0,0,0,.95)");

  c.textBaseline = "alphabetic";
  c.fillStyle = "#9d9a92"; fitText(c, x.logTitle, 600, 36, maxW); c.fillText(x.logTitle, L, 1370);
  c.fillStyle = home ? "#f1eee6" : "#e0907f"; const res = home ? x.home2 : x.cutAt(floor); fitText(c, res, 800, 92, maxW); c.fillText(res, L, 1490);
  c.fillStyle = "#f1eee6"; const sc = `${x.rewardLabel} ${x.yen(home ? bank() : 0)}`; fitText(c, sc, 700, 64, maxW); c.fillText(sc, L, 1600);
  c.fillStyle = "#c9c6bd"; const tag = x.tag === `#${x.gameName}` ? x.tag : `${x.gameName}  ${x.tag}`; fitText(c, tag, 600, 44, maxW); c.fillText(tag, L, 1760);

async function shareImage(home) {
