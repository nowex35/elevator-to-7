<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>夜間のエレベーター(仮)</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:#000; color:#e8e8e4; font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; overflow:hidden; }
  .stage { position:relative; width:min(100vw, calc(100dvh * 941 / 1672)); aspect-ratio:941/1672; margin:0 auto; overflow:hidden; background:#000; container-type:inline-size; user-select:none; }
  .stage > * { position:absolute; }
  .L { inset:0; width:100%; height:100%; object-fit:cover; }

  /* 廊下(開口部の向こう側)。枠で隠れるよう開口部で切り取る */
  .corr { inset:0; clip-path:inset(13.3% 10.6% 19.5% 9.8%); }
  .corr > * { position:absolute; }
  .person img { display:block; height:100%; width:auto; filter:brightness(.58) contrast(1.06) saturate(.7); }
  .person .shade { position:absolute; inset:0; background:linear-gradient(#f2fbf4 0%, transparent 30%, rgba(0,0,0,.6) 100%); mix-blend-mode:soft-light; -webkit-mask-size:100% 100%; mask-size:100% 100%; }
  .person.boarding { transition:opacity .7s ease .2s; opacity:0; }
  .shadow { border-radius:50%; background:radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,.35) 60%, transparent); filter:blur(3px); }
  .label { position:absolute; background:#e9e6dc; color:#222; font:600 2.1cqw/1.2 system-ui; padding:.4cqw .8cqw; transform:rotate(-2deg); white-space:nowrap; filter:brightness(.62); }

  /* 扉:開口部でクリップ。映り込みと天井の光は .rfix で扉の移動を打ち消して画面に固定 */
  .doors { left:9.8%; top:13.3%; width:79.6%; height:67.2%; overflow:hidden; }
  .door { position:absolute; top:0; height:100%; width:50%; overflow:hidden; transition:transform .9s cubic-bezier(.6,.05,.3,1); }
  .door > img { width:100%; height:100%; object-fit:cover; display:block; }
  .door.l { left:0; } .door.r { left:50%; }
  .stage.open .door.l { transform:translateX(-101%); } .stage.open .door.r { transform:translateX(101%); }
  .rfix { position:absolute; inset:0; transition:transform .9s cubic-bezier(.6,.05,.3,1); }
  .rfix.light { mix-blend-mode:hard-light; } .rfix.mirror { mix-blend-mode:screen; }
  .stage.open .door.l .rfix { transform:translateX(101%); } .stage.open .door.r .rfix { transform:translateX(-101%); }
  .refl { position:absolute; pointer-events:none; filter:blur(2.2px) grayscale(.4) brightness(1.2); transform:scaleX(-1); transform-origin:50% 100%; }
  .refl img { height:100%; width:auto; display:block; }

  /* 照明(廊下側。開口部で切り取る) */
  .fx > div { position:absolute; inset:0; pointer-events:none; }
  .fx .flicker { background:#000; opacity:0; animation:flick 3.7s infinite; }
  @keyframes flick { 0%,41%,44%,47%,100% { opacity:0; } 42% { opacity:.45; } 45% { opacity:.3; } 46% { opacity:.55; } 72% { opacity:0; } 73% { opacity:.4; } 74% { opacity:0; } }
  .fx .fardark { background:radial-gradient(ellipse 26% 20% at 50% 37%, rgba(0,0,0,.92) 35%, transparent 100%); }
  .fx .out { opacity:0; transition:opacity .25s; }
  .fx .out.o1 { background:radial-gradient(ellipse 22% 17% at 50% 37%, rgba(0,0,0,.95) 45%, transparent 100%); }
  .fx .out.o2 { background:radial-gradient(ellipse 48% 36% at 50% 37%, rgba(0,0,0,.95) 45%, transparent 100%); }
  .fx .out.o3 { background:radial-gradient(ellipse 90% 70% at 50% 40%, rgba(0,0,0,.93) 45%, transparent 100%); }
  .fx.going .out.o1 { opacity:1; transition-delay:1.4s; } .fx.going .out.o2 { opacity:1; transition-delay:2.6s; } .fx.going .out.o3 { opacity:1; transition-delay:3.8s; }
  .poster .note { font-size:2.4cqw; color:#555; margin-top:.8cqw; line-height:1.4; }
  .grain { inset:0; pointer-events:none; opacity:.09; mix-blend-mode:overlay; }
  .vig { inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,.6) 100%); }
  .dim { inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .15s; }

  /* HUD */
  .hud { left:0; right:0; top:0; height:12%; display:flex; align-items:center; justify-content:center; }
  .ind { font:700 6cqw/1 ui-monospace,Menlo,monospace; color:#ff6a3d; background:#120806; padding:1.2cqw 3cqw; border-radius:1cqw; letter-spacing:.5cqw; text-shadow:0 0 2cqw rgba(255,90,40,.7); min-width:22cqw; text-align:center; }
  .ind .arr { font-size:3.6cqw; vertical-align:.6cqw; margin-right:1.5cqw; }
  .ind.moving .arr { animation:blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .paper { left:4%; top:3%; width:10cqw; height:13cqw; background:#e2ded2; border-radius:.6cqw; box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.6); filter:brightness(.55); cursor:pointer; padding:1.5cqw 1.2cqw; }
  .paper i { display:block; height:.6cqw; background:#8b877d; margin:0 0 1.1cqw; border-radius:1px; }
  .langbtn { z-index:6; right:4%; top:4%; font:600 2.8cqw system-ui; color:#aaa; background:rgba(0,0,0,.5); border:1px solid #444; border-radius:5cqw; padding:1cqw 2.4cqw; cursor:pointer; }
  .bottom { left:0; right:0; bottom:0; height:19.5%; display:flex; align-items:center; justify-content:center; gap:7%; }
  .panel { display:grid; grid-template-columns:repeat(2, 6.6cqw); gap:1.4cqw; padding:2cqw; background:#1b1e20; border-radius:1.5cqw; border:.4cqw solid #3b4044; }
  .panel b { width:6.6cqw; height:6.6cqw; border-radius:50%; border:.4cqw solid #5d6368; display:flex; align-items:center; justify-content:center; font:700 2.8cqw ui-monospace,Menlo,monospace; color:#8a8f93; background:#2a2e31; }
  .panel b.on { color:#ffb08a; border-color:#ff7a4a; box-shadow:0 0 2cqw rgba(255,110,60,.6), inset 0 0 1.5cqw rgba(255,110,60,.4); }
  .ctl { display:flex; gap:4cqw; }
  .ctl button { width:19cqw; height:19cqw; border-radius:50%; border:.6cqw solid #8b9196; background:radial-gradient(#3d4246,#222629); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; box-shadow:inset 0 -.8cqw 1.5cqw rgba(0,0,0,.5); }
  .ctl button svg { width:11cqw; height:7cqw; }
  .ctl button svg * { fill:#d9dcd8; stroke:#d9dcd8; }
  .ctl button:active { transform:scale(.95); }
  .ctl button.on { border-color:#ff7a4a; box-shadow:0 0 2.5cqw rgba(255,110,60,.55), inset 0 0 1.5cqw rgba(255,110,60,.35); }
  .ctl button.on svg * { fill:#ffb08a; stroke:#ffb08a; }
  .ctl button[disabled] { opacity:.4; pointer-events:none; }
  .caption { left:8%; right:8%; top:74%; text-align:center; font:500 3.4cqw/1.4 system-ui; color:#ddd; text-shadow:0 0 1cqw #000, 0 0 2cqw #000; opacity:0; transition:opacity .4s; pointer-events:none; }
  .caption.on { opacity:1; }

  /* オーバーレイ(貼り紙/結果) */
  .ov { z-index:5; inset:0; background:rgba(0,0,0,.82); display:flex; flex-direction:column; align-items:center; justify-content:safe center; padding:5cqw 5cqw; gap:3cqw; overflow:auto; }
  .ov.hide { display:none; }
  .poster { flex:none; background:#ebe7da; color:#1d1d1b; width:100%; padding:4.5cqw 5cqw 3.5cqw; border-radius:.8cqw; box-shadow:0 2cqw 6cqw rgba(0,0,0,.7); font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .poster h2 { margin:0 0 .6cqw; font-size:4.4cqw; text-align:center; letter-spacing:.1cqw; white-space:nowrap; }
  .poster .sub { text-align:center; font-size:2.6cqw; margin:0 0 2.6cqw; color:#555; }
  .poster ol { margin:0; padding-left:5cqw; font-size:3.05cqw; line-height:1.5; }
  .poster li { margin:0 0 1.1cqw; }
  .poster li::marker { font-weight:700; }
  .poster .sign { text-align:right; font-size:2.6cqw; margin-top:1.2cqw; color:#555; }
  .intro { flex:none; font-size:3.1cqw; line-height:1.55; text-align:center; color:#ccc; }
  .intro b { color:#fff; }
  .go { flex:none; width:16cqw; height:16cqw; border-radius:50%; border:.7cqw solid #ff7a4a; background:#2a2e31; color:#ffb08a; font:700 7cqw ui-monospace,Menlo,monospace; box-shadow:0 0 4cqw rgba(255,110,60,.5); cursor:pointer; }
  .go small { display:block; font:500 2.2cqw system-ui; color:#aaa; margin-top:-.6cqw; }
  .row { display:flex; gap:2.5cqw; flex-wrap:wrap; justify-content:center; }
  .btn { font:600 3.4cqw system-ui; padding:2.4cqw 4.4cqw; border-radius:6cqw; border:1px solid #555; background:#1b1e20; color:#eee; cursor:pointer; text-decoration:none; }
  .btn.primary { background:#eee; color:#111; border-color:#eee; }
  .log { background:#e4e0d3; color:#1d1d1b; width:100%; padding:5cqw 6cqw; border-radius:.5cqw; box-shadow:0 2cqw 6cqw rgba(0,0,0,.7); font:3.5cqw/1.7 ui-monospace,"Osaka-Mono",Menlo,monospace; filter:brightness(.88); }
  .log h3 { margin:0 0 .5cqw; font:700 4.4cqw "Hiragino Mincho ProN","Yu Mincho",serif; text-align:center; letter-spacing:.4cqw; }
  .log .no { text-align:center; font-size:2.8cqw; color:#555; margin:0 0 3cqw; }
  .log .ln { display:flex; gap:3cqw; white-space:nowrap; }
  .log .ln span:last-child { white-space:normal; }
  .log .cut { margin-top:2cqw; color:#6b2a20; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .why { margin-top:2cqw; font-size:3cqw; line-height:1.6; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .why b { display:block; font-size:2.8cqw; color:#555; font-family:system-ui,sans-serif; font-weight:600; }
  .log .rep { margin-top:3cqw; padding-top:2cqw; border-top:1px dashed #999; }
  .log .rep h4 { margin:0 0 1cqw; font:700 3.4cqw "Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .rep .it { display:flex; justify-content:space-between; gap:2cqw; font-size:3cqw; }
  .log .rep .it .st { color:#8a6a1e; margin-right:1.5cqw; }
  .log .rep .tot { display:flex; justify-content:space-between; font-weight:700; margin-top:1cqw; font-size:3.6cqw; }
  .log .rep .tot.lost span:last-child { text-decoration:line-through; color:#888; }
  .log .rep .void { margin-top:1cqw; font-size:2.8cqw; color:#6b2a20; font-family:"Hiragino Mincho ProN","Yu Mincho",serif; }
  .log .rules { margin-top:3cqw; padding-top:2cqw; border-top:1px dashed #999; font-size:2.8cqw; color:#555; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="L" id="plate" alt="">
  <div class="L" id="bgAnom"></div>
  <div class="corr" id="corr"></div>
  <div class="corr fx" id="fx"></div>
  <div class="doors">
    <div class="door l"><img src="../compose/parts/door-l.jpg" alt=""><div class="rfix light" id="litL"></div><div class="rfix mirror" id="mirL"></div></div>
    <div class="door r"><img src="../compose/parts/door-r.jpg" alt=""><div class="rfix light" id="litR"></div><div class="rfix mirror" id="mirR"></div></div>
  </div>
  <canvas class="grain" id="grain"></canvas>
  <div class="vig"></div>
  <div class="hud"><div class="ind" id="ind"><span class="arr">▲</span><span id="fl">1</span></div></div>
  <div class="paper" id="paper" title="貼り紙"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button class="langbtn" id="lang">EN</button>
  <div class="caption" id="cap"></div>
  <div class="bottom">
    <div class="panel" id="panel"></div>
    <div class="ctl">
      <button id="openBtn" aria-label="開" disabled><svg viewBox="0 0 44 28"><path d="M2 14 L16 4 L16 24 Z"/><path d="M42 14 L28 4 L28 24 Z"/><line x1="22" y1="2" x2="22" y2="26" stroke-width="2.4"/></svg></button>
      <button id="closeBtn" aria-label="閉" disabled><svg viewBox="0 0 44 28"><path d="M19 14 L5 4 L5 24 Z"/><path d="M25 14 L39 4 L39 24 Z"/><line x1="22" y1="2" x2="22" y2="26" stroke-width="2.4"/></svg></button>
    </div>
  </div>
  <div class="dim" id="dim"></div>
  <div class="ov" id="ovPoster"></div>
  <div class="ov hide res" id="ovResult"></div>
</div>

<script>
// ============ 素材 ============
const P = "../compose/parts/";
const PEOPLE = {
  a:       { src: "person-a.png",  s: 1,    ja: "管理人",       en: "the caretaker" },
  salary:  { src: "p-salary.png",  s: 1.02, ja: "サラリーマン", en: "the office worker" },
  pajama:  { src: "p-pajama.png",  s: .94,  ja: "パジャマの女", en: "the woman in pajamas" },
  deliv:   { src: "p-deliv.png",   s: 1,    ja: "配達員",       en: "the delivery man" },
  kid:     { src: "p-kid.png",     s: .7,   ja: "男の子",       en: "the boy" },
  hood:    { src: "p-hood.png",    s: 1,    ja: "フードの男",   en: "the hooded man" },
  monk:    { src: "p-monk.png",    s: .97,  ja: "お坊さん",     en: "the monk" },
  granny:  { src: "p-granny.png",  s: .78,  ja: "おばあさん",   en: "the old woman" },
  woman:   { src: "p-woman.png",   s: .95,  ja: "女",           en: "the woman" },
  mourner: { src: "p-mourner.png", s: .93,  ja: "喪服の女",     en: "the woman in mourning" },
  funeral: { src: "p-funeral.png", s: 1,    ja: "葬儀社の男",   en: "the funeral director" },
  oldman:  { src: "p-oldman.png",  s: .92,  ja: "寝間着の老人", en: "the barefoot old man" },
};
// 立ち位置(941x1672 座標)
const POS = {
  board: { cx: 500, feet: 1300, h: 860 },
  far:   { cx: 600, feet: 1010, h: 430 },
  side:  { cx: 700, feet: 1180, h: 700 },
  pass:  { cx: 300, feet: 1150, h: 640 },
};

// ============ 住人の「いつも」(階ごとの候補。夜ごとにどれか1つ) ============
// board: 乗るか / dest: 降りる階 / press: 自分で押すボタン / cap: 字幕 / at: 立ち位置
const ROUTINE = {
  2: [{ p: "salary", board: true, dest: 4, at: "board" },
      { p: "pajama", board: false, at: "pass", cap: "pajama" }],
  3: [{ p: "a", board: true, dest: 5, at: "board", cap: "nod" },
      { p: "deliv", board: true, dest: 6, at: "board" }],
  4: [{ p: "kid", board: true, dest: 6, press: 6, at: "board" },
      { p: "hood", board: false, at: "far" }],
  5: [{ p: "monk", board: true, dest: 6, press: 6, at: "board", cap: "gassho" },
      { p: "granny", board: true, dest: 6, at: "board", cap: "sumimasen" },
      { p: "woman", board: true, dest: 6, at: "board" }],
  6: [{ p: "mourner", board: false, at: "side", cap: "bow" },
      { p: "funeral", board: false, at: "side", cap: "kochira" }],
};
const HOME = {}; for (const f in ROUTINE) for (const r of ROUTINE[f]) HOME[r.p] = { f: +f, ...r };

// ============ 文言 ============
const T = {
  ja: {
    title: "夜間のエレベーターご利用について", sub: "— 本日の注意事項 —", sign: "団地管理組合",
    intro: "部屋は<b>7階</b>。乗ったら、<b>振り向かない</b>こと。<br>止まったら、<b>開ける</b>か、<b>閉</b>で通り過ぎるか。<br>開けたら、おかしければ<b>閉める</b>。なければ<b>待つ</b>。<br>見届けたものはスコアになる。失敗すれば<b>0</b>。",
    go: "7を押す", paper: "貼り紙",
    rules: {
      R1: "お子さまがおひとりで乗られた際、行き先ボタンを押されない場合は、扉をお閉めください。",
      R2: "本日6階にてご葬儀がございます。6階以外で喪服の方をお見かけした場合は、扉をお閉めください。",
      R3: "裸足の方は、お乗せにならないでください。",
      R5: "廊下に履物がそろえて置かれている階では、扉をお閉めください。",
      R6: "住人の方が、いつもと違う階からお乗りになった場合は、扉をお閉めください。",
      R7: "お坊様がお降りになる階では、扉が閉まるまで頭をお下げください。",
      R8: "22時以降、4階のボタンは押さないでください。",
      R9: "扉に映るご自身に、話しかけないでください。",
      R11: "前の階と同じ物が廊下に置かれている場合は、扉をお閉めください。",
      R12: "扉を開けたあと、廊下の明かりが奥から消えていく場合は、扉をお閉めください。",
      R13: "いつも挨拶をされる方が、挨拶をされない場合は、扉をお閉めください。",
    },
    catchAll: "上記のほか、少しでも異常を感じた場合は、扉をお閉めください。",
    note: "※廊下の照明のちらつきは点検中のためです。お気になさらないでください。",
    caps: { nonod: "……会釈がない。じっとこちらを見ている。", wake: "……通夜の参列者のようだ。", noturn: "……振り向かないほうがいい。", r707: "「707の方ですよね」", monk7: "「7階まで、ご一緒します」", nod: "……会釈された。", gassho: "……手を合わせている。", sumimasen: "「すみませんねぇ」", bow: "……深く一礼された。", kochira: "「こちらです」", pajama: "……ゴミを出しに行くらしい。", home: "「おかえりなさい」" },
    logTitle: "夜間運行記録", night: n => `記録番号 ${serial(n)}`,
    L: { passed: "開けずに通過した", empty: "誰もいなかった", boarded: n => `${n}が乗った`, stood: n => `${n}がいた`, closed: "扉を閉めた", letIn: n => `${n}を乗せた`, notClosed: "扉を閉めなかった", wrongClose: "扉を閉めた", home: "おかえりなさい", cut: "――記録はここで途切れている" },
    repTitle: "出会った現象", total: "スコア", rewardLabel: "スコア", yen: n => n.toLocaleString("ja-JP"),
    void: "記録が途中で途切れたため、スコアは記録されません。", none: "(なし)", rarest: "最も珍しい記録",
    home2: "7階に帰り着いた", cutShort: "記録はここで途切れている",
    ph: { QUIET: "静かな階", R: n => `${n}に会った`, WAKE_LINE: "通夜の列", SHOES: "そろえられた赤い靴", OLDMAN: "裸足の老人", WRONG_FLOOR: n => `いつもと違う階の${n}`, MOURNER_OFF6: "6階ではない喪服",
      LIGHTS_OUT: "消えていく明かり", OJISAN_NO_NOD: "会釈しない管理人", FINGERS: "隙間の指", INDICATOR_13: "13階", CAPTION_707: "「707の方ですよね」", PROP_FOLLOW: n => `ついてくる${n}`, DELIV_LABEL: "707号室宛の荷物",
      KID_NOBUTTON: "行き先を押さない子", MONK_7: "7階まで行くお坊さん", REBOARD: n => `また乗ってくる${n}`, ALL_BUTTONS: "全部点いたボタン", HOME_EARLY: "早すぎる「おかえりなさい」" },
    props: { tricycle: "三輪車", box: "段ボール箱", umbrella: "ビニール傘" },
    share: "Xでシェア", copy: "コピー", copied: "コピーしました", replay: "もう一度プレイ",
    whyTitle: "何が起きていたか",
    why: { WRONG_FLOOR: (n, h) => `${n}は、いつも${h}階から乗る。`, REBOARD: n => `${n}は、ひとつ前の階で乗ったばかりだった。`,
      MOURNER_OFF6: "喪服の人がいるのは、6階の通夜だけのはずだった。", OLDMAN: "その人は、裸足だった。", SHOES: "廊下に、赤い靴がそろえて置かれていた。",
      KID_NOBUTTON: "男の子は、行き先のボタンを押さなかった。", PROP_FOLLOW: (n, h, pr) => `${pr}が、前の階からついてきていた。`, LIGHTS_OUT: "廊下の明かりが、奥から消えていった。",

    if (kind === "tv") { const l = AC.createOscillator(); l.frequency.value = 3.3; const lg = AC.createGain(); lg.gain.value = .03; l.connect(lg).connect(g.gain); l.start(); nodes.push(l); }
  } else if (kind === "chant") {
    for (const fr of [98, 147, 196]) { const o = AC.createOscillator(); o.type = "triangle"; o.frequency.value = fr; const g = AC.createGain(); g.gain.value = .012;
      const l = AC.createOscillator(); l.frequency.value = .7; const lg = AC.createGain(); lg.gain.value = .01; l.connect(lg).connect(g.gain); o.connect(g).connect(out); o.start(); l.start(); nodes.push(o, l); }
  }

function sDrop() { if (!AC) return; const t0 = AC.currentTime, o = AC.createOscillator(); o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(30, t0 + 1.5); env(o, t0, .01, .25, 1.6); o.start(t0); o.stop(t0 + 1.8); }

// ============ 進行 ============
const wait = ms => new Promise(r => setTimeout(r, ms));
let streak = 0, openedAt = 0, arrivedAt = 0, hesitMs = 0, lastDeath = null;
let floor = 1, riders = [], log = [], seen = [], decide = null, opener = null, extend = null, skipper = null;
const phKey = e => e.anomaly || (e.wake ? "WAKE_LINE" : e.p ? "R_" + e.p : "QUIET");
const phName = e => { const k = phKey(e), ph = t().ph, n = e.p ? PEOPLE[e.p][lang] : "";
  if (k.startsWith("R_")) return ph.R(n); if (k === "PROP_FOLLOW") return ph[k](t().props[e.follow]); return typeof ph[k] === "function" ? ph[k](n) : ph[k]; };
const bank = () => seen.reduce((a, s) => a + s.pts, 0);
// スコアは結果画面でだけ見せる(プレー中は出さない)。
// 1つの現象の点 = 基本点(★) × 階の高さ × 連続で開けた数 × 開けるまでのためらい × 反応の速さ(異変のみ) × 暗さ
const DOOR_OPEN_MS = 6000;
function scoreItem(base, f, streak, closed, ms, lights, hesitMs) {
  const boldM = 1 + Math.max(0, 4000 - hesitMs) / 8000;                // 着いてから「開」を押すまでが速いほど高い(最大1.5倍)
  const floorM = 1 + (f - 2) * .15;                                   // 2階 1.00 〜 6階 1.60
  const streakM = 1 + (streak - 1) * .25;                              // 通過せずに開け続けた数
  const speedM = closed ? 1 + Math.max(0, DOOR_OPEN_MS - ms) / DOOR_OPEN_MS : 1; // 異変に気づいて閉めるまでが速いほど高い(最大約2倍)
  const darkM = lights === "fardark" ? 1.2 : lights === "flicker" ? 1.1 : 1;
  return Math.round(base * floorM * streakM * boldM * speedM * darkM);
}
const clock = i => `02:${String(13 + i).padStart(2, "0")}`;
const riderPos = i => ({ cx: 380 + i * 170, feet: 1270, h: 700 });
async function openDoors() { sDoor(); stage.classList.add("open"); await wait(950); }
async function closeDoors() { sDoor(); stage.classList.remove("open"); await wait(950); }
function setScene(f, e) {
  $("plate").src = P + "corridor.jpg";
  let bg = "";
  for (const pr of e?.env?.props || []) bg += `<img class="L" src="${P}prop-${pr}.png" alt="">`;
  if (e?.anomaly === "SHOES") bg += `<img class="L" src="${P}anom-shoes.png" alt="">`;
  if (e?.anomaly === "FINGERS") bg += `<img class="L" src="${P}anom-fingers.png" alt="">`;
  $("bgAnom").innerHTML = bg;
  let c = "";
  if (e && e.wake) c += WAKE_LINE();
  if (e && e.p) {
    c += personHTML(e.p, POS[e.at], "", e.at !== "far");
    if (e.anomaly === "DELIV_LABEL") c += `<div class="label" style="left:47.5%;top:${pct(1300 - 860 * .93, 1672)}">${t().room}</div>`;
  }
  $("corr").innerHTML = c;
  const L = e?.env?.lights;
  $("fx").className = "corr fx";
  $("fx").innerHTML = (L === "flicker" ? '<div class="flicker"></div>' : L === "fardark" ? '<div class="fardark"></div>' : "")
    + (e?.anomaly === "LIGHTS_OUT" ? '<div class="out o1"></div><div class="out o2"></div><div class="out o3"></div>' : "");
}
async function travel(to) {
  $("ind").classList.add("moving"); sTravel(true);
  await wait(1700);
  floor = to; $("fl").textContent = to;
  await wait(500); sTravel(false); $("ind").classList.remove("moving");
}
async function start() {
  audioInit(); $("ovPoster").classList.add("hide"); $("ovResult").classList.add("hide");
  floor = 1; riders = []; log = []; seen = []; streak = 0; lastDeath = null; lit = new Set([7]); paintPanel(); $("fl").textContent = 1;
  stage.classList.remove("open"); setMirror([]); $("dim").style.opacity = 0;
  for (const f of [2, 3, 4, 5, 6]) {
    await travel(f);
    const ok = await stop(f);
    if (!ok) return;
  }
  await travel(7); await arriveHome();
}
async function stop(f) {
  const e = NIGHT.ev[f], x = t().L, name = e.p ? PEOPLE[e.p][lang] : "";
  lit.delete(f); paintPanel();
  setScene(f, e); sChime();
  // 開けて確かめるか(リスクあり・スコアあり)、閉で通過するか(安全・スコアなし)
  $("openBtn").disabled = false; $("openBtn").classList.add("on"); $("closeBtn").disabled = false;
  arrivedAt = performance.now();
  const go = await new Promise(res => { opener = () => res(true); skipper = () => res(false); });
  hesitMs = performance.now() - arrivedAt; opener = skipper = null; $("openBtn").classList.remove("on");
  if (!go) { streak = 0; $("openBtn").disabled = $("closeBtn").disabled = true; sTick(); log.push([clock(log.length), f, x.passed]); await wait(500); return true; }
  streak++;
  $("closeBtn").disabled = true;
  riders = riders.filter(r => r.dest !== f); // 扉を開けた階でだけ、降りる人は降りる
  if (e.anomaly === "INDICATOR_13") $("fl").textContent = "13";
  const litBefore = new Set(lit);
  if (e.anomaly === "ALL_BUTTONS") { [1, 2, 3, 4, 5, 6, 7].forEach(n => lit.add(n)); setTimeout(paintPanel, 700); }
  sAmb(e.env.sound); await openDoors();
  if (e.anomaly === "LIGHTS_OUT") $("fx").classList.add("going");
  openedAt = performance.now();
  $("closeBtn").disabled = false;
  const timers = [];
  if (e.cap) timers.push(setTimeout(() => caption(e.cap), 1100));
  if (e.board && e.press) timers.push(setTimeout(() => { lit.add(e.press); paintPanel(); sTick(); }, 2300));
  // 何もしなければ約6秒で閉まる。開いている間に「開」を押すと延長
  const closed = await new Promise(res => {
    decide = res; let to = setTimeout(() => res(false), DOOR_OPEN_MS);
    extend = () => { clearTimeout(to); to = setTimeout(() => res(false), DOOR_OPEN_MS); timers.push(to); };
    timers.push(to);
  });
  const reactMs = performance.now() - openedAt;
  decide = extend = null; timers.forEach(clearTimeout); caption(null); $("closeBtn").disabled = true; $("openBtn").disabled = true; ambStop && ambStop();
  $("fl").textContent = f;
  if (e.anomaly === "ALL_BUTTONS") { lit = litBefore; paintPanel(); }
  const isAnom = !!e.anomaly, correct = closed === isAnom, i = log.length;
  if (correct) {
    let line = closed ? x.closed : !e.p ? x.empty : e.board ? x.boarded(name) : x.stood(name);
    if (!closed && e.board) { stage.querySelector(".person")?.classList.add("boarding"); riders.push({ p: e.p, dest: e.dest }); if (e.dest) { lit.add(e.dest); paintPanel(); } }
    setMirror(riders.map((r, k) => ({ p: r.p, pos: riderPos(k), o: .26 })));
    await closeDoors(); log.push([clock(i), f, line]);
    const k = phKey(e); if (k && PTS[k] && PTS[k][0] > 0) seen.push({ name: phName(e), pts: scoreItem(PTS[k][0], f, streak, closed, reactMs, e.env.lights, hesitMs), stars: PTS[k][1] });
    return true;
  }
  if (closed && !isAnom) {
    // 異変がないのに閉めた: ドボンにはしない。その階のスコアが入らないだけ(乗ろうとしていた住人は乗らない)
    setMirror(riders.map((r, k) => ({ p: r.p, pos: riderPos(k), o: .26 })));
    await closeDoors(); log.push([clock(i), f, x.closed]); return true;
  }
  lastDeath = e;
  if (!closed && e.board) {
    // ドボン: 乗せた。扉が閉まると、すぐ後ろに映る
    log.push([clock(i), f, x.letIn(name)]);
    stage.querySelector(".person")?.classList.add("boarding");
    setMirror([...riders.map((r, k) => ({ p: r.p, pos: riderPos(k), o: .22 })), { p: e.p, pos: { cx: 480, feet: 1480, h: 1180 }, o: .55 }]);
    await closeDoors(); sSting(); await wait(1600);
    $("dim").style.opacity = 1; await wait(900);
    return result(false), false;
  }
  log.push([clock(i), f, closed ? x.wrongClose : x.notClosed]);
  await closeDoors(); sDrop(); $("dim").style.opacity = 1; await wait(1300);
  return result(false), false;
}
const WAKE_LINE = () => personHTML("funeral", { cx: 560, feet: 990, h: 400 }) + personHTML("mourner", { cx: 620, feet: 1060, h: 500 }) + personHTML("monk", { cx: 700, feet: 1150, h: 640 });
async function arriveHome() {
  setMirror([]); $("plate").src = P + "corridor.jpg"; $("bgAnom").innerHTML = ""; $("fx").innerHTML = "";
  $("corr").innerHTML = WAKE_LINE();
  sChime();
  $("openBtn").disabled = false; $("openBtn").classList.add("on");
  await new Promise(res => opener = res); opener = null; $("openBtn").classList.remove("on"); $("openBtn").disabled = true;
  await openDoors();
  setTimeout(() => caption("home"), 1500); await wait(4200); caption(null);
  $("dim").style.opacity = 1; await wait(900);
  log.push([clock(log.length), 7, t().L.home]); result(true);
}
function repHTML(home) {
  const x = t();
  const items = seen.length ? seen.map(it => `<div class="it"><span><span class="st">${it.stars ? "★".repeat(it.stars) : ""}</span>${it.name}</span><span>${x.yen(it.pts)}</span></div>`).join("") : `<div class="it"><span>${x.none}</span></div>`;
  return `<div class="rep"><h4>${x.repTitle}</h4>${items}
    <div class="tot ${home ? "" : "lost"}"><span>${x.total}</span><span>${x.yen(bank())}</span></div>
    ${home ? "" : `<div class="void">${x.void}</div>`}</div>`;
}
// ドボンしたとき、何が起きていたかを1行で明かす(次の挑戦で活かせるように)
function whyHTML() {
  const e = lastDeath; if (!e) return "";
  const w = t().why[e.anomaly || "NORMAL"], n = e.p ? PEOPLE[e.p][lang] : "", h = e.p && HOME[e.p] ? HOME[e.p].f : "", pr = e.follow ? t().props[e.follow] : "";
  return `<div class="why"><b>${t().whyTitle}</b>${typeof w === "function" ? w(n, h, pr) : w}</div>`;
}
function logHTML(home) {
  const x = t();
  return `<div class="log"><h3>${x.logTitle}</h3><div class="no">${x.night(seed)}</div>
    ${log.map(([tm, f, l]) => `<div class="ln"><span>${tm}</span><span>${f}F</span><span>${l}</span></div>`).join("")}
    ${home ? "" : `<div class="cut">${x.L.cut}</div>${whyHTML()}`}

function shareText(home) {
  const x = t(), top = [...seen].sort((a, b) => b.stars - a.stars || b.pts - a.pts)[0];
  const lines = [`${x.gameName}`, x.night(seed), home ? x.home2 : x.cutShort, `${x.rewardLabel} ${x.yen(home ? bank() : 0)}`];

}
function result(home) {
  const x = t(), text = shareText(home), url = `${location.origin}${location.pathname}?seed=${seed}${lang === "en" ? "&lang=en" : ""}`;
  const ov = $("ovResult");
  ov.innerHTML = logHTML(home) + `
    <div class="row"><a class="btn primary" target="_blank" rel="noopener" href="https://x.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}">${x.share}</a>
    <button class="btn" id="cp">${x.copy}</button></div>

  $("replay").onclick = () => { seed = newSeed(); history.replaceState(null, "", `?seed=${seed}${lang === "en" ? "&lang=en" : ""}`); NIGHT = buildNight(seed); showPoster(); };
  window.__last = { home, text, url };
}
function showPoster() {
  $("dim").style.opacity = 0; $("ovResult").classList.add("hide");
  $("ovPoster").innerHTML = posterHTML() + `<div class="intro">${t().intro}</div><button class="go" id="go">7<small>${t().go}</small></button>`;

$("closeBtn").onclick = () => { if (skipper) skipper(); else if (decide) { sTick(); decide(true); } };

// 貼り紙は乗る前(最初の画面)にしか読めない。途中で見ようとすると字幕だけ出す
$("paper").onclick = () => { if ($("ovPoster").classList.contains("hide") && $("ovResult").classList.contains("hide")) { caption("noturn"); setTimeout(() => caption(null), 1800); } };
